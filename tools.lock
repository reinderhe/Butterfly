# The build tools the Longshot Builders need, which are not in Longshot's releases: windows-x64 for the Windows builder,
# linux-x64 for the Linux one (its AppImage carries only the builder and its Python). The Windows builder's setup, the Linux
# AppImage's first start (builder/linux/linux_tools.py) and the Longshot Launcher download each one they lack, check its
# SHA-256 and size, and unpack it into the install; a tool another installed version has is taken from it, not downloaded
# again (docs/releases.md, "tools.lock"). A change is a pull request that edits this file; scripts/tools.py checks it,
# mirrors an upstream archive, and assembles and uploads ours (RELEASING.md, "Bump a tool"). The Linux lines are ours,
# made by scripts/linux/deps.sh tools from its pinned downloads.
#
#   tool <name> <version> <system> <sha256> <size> <dest> <prefix> <url> [<url> ...]
#
# dest: the folder the tool becomes in a builder install (Windows: under LongshotBuilder/tools; Linux: beside the AppImage's
# usr/share/longshot, where the AppImage had them). prefix: the folder inside the archive that becomes dest ("-": the whole
# archive). A Linux archive keeps its files' modes and its relative links.
#
# The URLs are tried in order: first Longshot's copy, a file of the MagicBeanDev organization's generic package
# <name>-<system>, version <version> (its Packages tab), from Cloudflare's edge
# (https://git-cdn.magicbean.dev/api/packages/MagicBeanDev/generic/<name>-<system>/<version>/<sha256>-<name>.zip), then the
# same file from git.magicbean.dev (the same path), then where it came from (upstream, or NotRexed/Hookshot's release) as
# the fallback. Archives Longshot assembles (a tool with our
# packages, the Linux tools) are only there. A package version's files never change: a new archive is a new version.
#
# Taken as they are from Hookshot v2.1.0's Windows builder (NotRexed/Hookshot, release builder-parts): python, emsdk and
# wgpu-native; cpm is Hookshot's with dav1d added (scripts/windows/dav1d.sh), third-party the prebuilt files of its
# third_party part (tools.py assemble). The linux-x64 lines: scripts/linux/deps.sh tools (LLVM 23.1.5's clang and lld;
# FFmpeg with dav1d; SDL2; the Vulkan, SPIR-V and VMA headers; Ubuntu 22.04's glibc 2.35 sysroot). No play profile yet: it
# is optional (tools.py REQUIRED).
